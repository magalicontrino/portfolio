<script>
/* Pluie sur une vitre — canvas 2D, sans dependance. Densifiee a la demande. */
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('pluie');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var L, H;
  function dim() {
    L = innerWidth; H = innerHeight;
    cv.width = L * dpr; cv.height = H * dpr;
    cv.style.width = L + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  dim(); addEventListener('resize', dim);
  var gouttes = [], traces = [];
  function poserStatiques(n) {
    for (var i = 0; i < n; i++)
      gouttes.push({ x: Math.random()*L, y: Math.random()*H,
                     r: 1.4 + Math.random()*4, vy: 0, coule: false });
  }
  poserStatiques(Math.round(L * H / 1600));
  for (var q = 0; q < Math.max(6, L / 130); q++)
    gouttes.push({ x: Math.random()*L, y: Math.random()*H, r: 5 + Math.random()*3.5,
                   vy: 1.5 + Math.random()*2.5, coule: true });
  function dessiner(g) {
    var r = g.r;
    ctx.beginPath(); ctx.arc(g.x + r*0.12, g.y + r*0.42, r*0.96, 0, 6.2832);
    ctx.fillStyle = 'rgba(10,10,12,0.22)'; ctx.fill();
    var grad = ctx.createRadialGradient(g.x - r*0.32, g.y - r*0.36, r*0.05, g.x, g.y, r);
    grad.addColorStop(0,'rgba(255,255,255,0.78)');
    grad.addColorStop(0.35,'rgba(228,233,240,0.34)');
    grad.addColorStop(0.72,'rgba(150,158,170,0.18)');
    grad.addColorStop(0.93,'rgba(70,74,84,0.34)');
    grad.addColorStop(1,'rgba(30,32,40,0.60)');
    ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, 6.2832); ctx.fillStyle = grad; ctx.fill();
    if (r > 1.4) {
      ctx.beginPath(); ctx.arc(g.x - r*0.36, g.y - r*0.38, r*0.24, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.fill();
    }
  }
  var dernier = 0;
  function boucle(t) {
    var dt = Math.min((t - dernier) || 16, 40) / 16; dernier = t;
    ctx.clearRect(0, 0, L, H);
    for (var i = 0; i < gouttes.length; i++) {
      var g = gouttes[i];
      if (!g.coule) {
        g.r += 0.0018 * dt * (0.5 + Math.random());
        if (g.r > 3.6 && Math.random() < 0.010 * dt) g.coule = true;
      } else {
        g.vy += 0.06 * dt; g.y += g.vy * dt; g.x += Math.sin(g.y*0.05)*0.45;
        if (Math.random() < 0.5) traces.push({ x: g.x+(Math.random()-0.5)*g.r,
                                               y: g.y-g.r, r: g.r*(0.18+Math.random()*0.22), a: 1 });
        g.r -= 0.02 * dt;
        for (var j = 0; j < gouttes.length; j++) {
          var sdr = gouttes[j];
          if (sdr === g || sdr.coule) continue;
          var dx = sdr.x-g.x, dy = sdr.y-g.y;
          if (dx*dx + dy*dy < (g.r+sdr.r)*(g.r+sdr.r)) {
            g.r = Math.min(9, Math.sqrt(g.r*g.r + sdr.r*sdr.r));
            sdr.x = Math.random()*L; sdr.y = Math.random()*H; sdr.r = 1.4 + Math.random()*1.5;
          }
        }
        if (g.y - g.r > H || g.r < 1) {
          g.x = Math.random()*L; g.y = -10; g.r = 1.4 + Math.random()*3;
          g.vy = 1 + Math.random(); g.coule = true;
        }
      }
      dessiner(g);
    }
    for (var k = traces.length-1; k >= 0; k--) {
      var tr = traces[k]; tr.a -= 0.012 * dt;
      if (tr.a <= 0) { traces.splice(k,1); continue; }
      ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(210,214,222,' + (tr.a*0.28) + ')'; ctx.fill();
    }
    requestAnimationFrame(boucle);
  }
  if (reduce) gouttes.forEach(function (g) { g.r = 1.4 + Math.random()*3.5; dessiner(g); });
  else requestAnimationFrame(boucle);
})();
</script>
