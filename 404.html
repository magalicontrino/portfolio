<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — magalicontrino</title>
<meta name="robots" content="noindex" />
<!-- Page servie à l'URL manquante, à n'importe quelle profondeur : les chemins
     relatifs y casseraient. Tout est donc en absolu — le site est à la racine
     du domaine. -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<style>
  @font-face {
    font-family: 'Unigeo 64 Variable Trial';
    src: url('/assets/fonts/655c9978f8882e62e8fca303_Unigeo64-Variable-trial.ttf') format('truetype');
    font-weight: 100 820;
    font-style: normal;
    font-display: swap;
  }
  :root { --sombre:#1c1a1a; --rose:#e6296f; --rouge:#ff0200; --fond:#f8f8f8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Unigeo 64 Variable Trial', -apple-system, sans-serif;
    color:var(--sombre);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden; position:relative;
    /* Ciel de pluie : un dégradé gris-bleu très doux vers le blanc du site, pour
       que les gouttes claires aient de quoi se détacher. */
    background:
      radial-gradient(120% 80% at 50% -10%, #d7dde4 0%, #e9ecf0 34%, var(--fond) 72%);
  }
  /* La pluie couvre tout mais laisse cliquer au travers. */
  #pluie { position:fixed; inset:0; z-index:1; pointer-events:none; }
  .contenu { position:relative; z-index:2; text-align:center; padding:24px;
    display:flex; flex-direction:column; align-items:center; }
  /* Cette police rend le 0 et le 4 quasi identiques (un cercle barré) : un
     « 404 » géant y est illisible. On le garde en petite étiquette, où la
     géométrie n'est plus qu'un ornement, et on donne le premier rôle au
     message — qui, lui, se lit parfaitement. */
  .code {
    font-weight:300; font-size:15px; letter-spacing:.5em;
    text-transform:uppercase; color:var(--sombre); opacity:.55;
    display:inline-flex; align-items:center; margin-bottom:22px; padding-left:.5em;
  }
  .code .pt { width:6px; height:6px; background:var(--rouge); margin-left:.7em; }
  .msg {
    font-weight:200; font-variation-settings:'wght' 200;
    font-size:clamp(34px, 6.4vw, 72px); line-height:1.04; max-width:12em;
  }
  .msg .pt-rose { color:var(--rose); }
  .retour {
    display:inline-flex; align-items:center; gap:.6em; margin-top:44px;
    padding:14px 28px; border:1px solid var(--sombre); border-radius:8px;
    font-weight:300; font-size:18px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--sombre); text-decoration:none; background:rgba(248,248,248,.55);
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
    transition:background .3s ease, color .3s ease;
  }
  .retour:hover { background:var(--sombre); color:#fff; }
  .retour .fleche { font-size:1.1em; line-height:1; }
  @media (prefers-reduced-motion: reduce) { .retour { transition:none; } }
</style>
</head>
<body>

<canvas id="pluie" aria-hidden="true"></canvas>

<main class="contenu">
  <div class="code">erreur quatre&#8209;cent&#8209;quatre<span class="pt" aria-hidden="true"></span></div>
  <p class="msg">cette page a filé<br>sous la pluie<span class="pt-rose">.</span></p>
  <a class="retour" href="/accueil/"><span class="fleche">&larr;</span> retour à l'accueil</a>
</main>

<script>
/* =========================================================
   Pluie sur une vitre — canvas 2D, sans aucune dépendance.

   Inspiré de l'effet Droplets de Canvas UI, mais réécrit de zéro : l'original
   est un shader WebGL empaqueté en React, incompatible avec ce site autonome.
   Ici, des gouttes-lentilles posées sur la vitre ; de temps en temps l'une
   grossit et se met à glisser, absorbant celles qu'elle croise et laissant une
   traînée mouillée.
   ========================================================= */
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('pluie');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var L, H;

  function dim() {
    L = innerWidth; H = innerHeight;
    cv.width = L * dpr; cv.height = H * dpr;
    cv.style.width = L + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  dim();
  addEventListener('resize', dim);

  // Une goutte : position, rayon, et sa vitesse de chute si elle coule.
  var gouttes = [];
  var traces = []; // perles laissées derrière une goutte qui coule

  function poserStatiques(n) {
    for (var i = 0; i < n; i++) {
      gouttes.push({ x: Math.random() * L, y: Math.random() * H,
                     r: 1.4 + Math.random() * 4, vy: 0, coule: false });
    }
  }
  poserStatiques(Math.round(L * H / 2400));
  // Quelques coulures déjà en route, pour qu'il pleuve dès l'ouverture.
  for (var q = 0; q < Math.max(3, L / 260); q++) {
    gouttes.push({ x: Math.random() * L, y: Math.random() * H, r: 5 + Math.random() * 3,
                   vy: 1 + Math.random() * 2, coule: true });
  }

  // Dessine une goutte comme une perle de verre : une ombre portée qui la
  // décolle de la vitre, un corps qui s'assombrit sur les bords (la réfraction),
  // et un éclat de lumière en haut à gauche.
  function dessiner(g) {
    var r = g.r;
    // ombre portée, décalée vers le bas
    ctx.beginPath();
    ctx.arc(g.x + r * 0.12, g.y + r * 0.42, r * 0.96, 0, 6.2832);
    ctx.fillStyle = 'rgba(40,44,52,0.16)';
    ctx.fill();
    // corps réfractant
    var grad = ctx.createRadialGradient(g.x - r * 0.32, g.y - r * 0.36, r * 0.05,
                                        g.x, g.y, r);
    grad.addColorStop(0,    'rgba(255,255,255,0.72)');
    grad.addColorStop(0.35, 'rgba(228,233,240,0.30)');
    grad.addColorStop(0.72, 'rgba(150,158,170,0.16)');
    grad.addColorStop(0.93, 'rgba(90,96,108,0.30)');
    grad.addColorStop(1,    'rgba(52,56,66,0.55)');
    ctx.beginPath();
    ctx.arc(g.x, g.y, r, 0, 6.2832);
    ctx.fillStyle = grad;
    ctx.fill();
    // éclat spéculaire
    if (r > 1.4) {
      ctx.beginPath();
      ctx.arc(g.x - r * 0.36, g.y - r * 0.38, r * 0.24, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fill();
    }
  }

  var dernier = 0;
  function boucle(t) {
    var dt = Math.min((t - dernier) || 16, 40) / 16;
    dernier = t;
    ctx.clearRect(0, 0, L, H);

    // On fait grossir puis couler quelques grosses gouttes.
    for (var i = 0; i < gouttes.length; i++) {
      var g = gouttes[i];
      if (!g.coule) {
        // grossit très lentement ; passé un seuil, elle se met à couler
        g.r += 0.0016 * dt * (0.5 + Math.random());
        if (g.r > 4 && Math.random() < 0.006 * dt) g.coule = true;
      } else {
        g.vy += 0.05 * dt;                 // gravité
        g.y += g.vy * dt;
        g.x += Math.sin(g.y * 0.05) * 0.4; // léger frétillement
        // laisse une perle de temps en temps
        if (Math.random() < 0.4) traces.push({ x: g.x + (Math.random() - 0.5) * g.r,
                                               y: g.y - g.r, r: g.r * (0.18 + Math.random() * 0.22), a: 1 });
        g.r -= 0.02 * dt;                  // s'amenuise en coulant
        // absorbe les statiques croisées
        for (var j = 0; j < gouttes.length; j++) {
          var s = gouttes[j];
          if (s === g || s.coule) continue;
          var dx = s.x - g.x, dy = s.y - g.y;
          if (dx * dx + dy * dy < (g.r + s.r) * (g.r + s.r)) {
            g.r = Math.min(9, Math.sqrt(g.r * g.r + s.r * s.r));
            s.x = Math.random() * L; s.y = Math.random() * H; s.r = 0.7 + Math.random() * 1.5;
          }
        }
        if (g.y - g.r > H || g.r < 1) {    // sortie ou tarie -> renaît en haut
          g.x = Math.random() * L; g.y = -10; g.r = 0.7 + Math.random() * 2.2;
          g.vy = 0; g.coule = false;
        }
      }
      dessiner(g);
    }

    // Les traces s'estompent.
    for (var k = traces.length - 1; k >= 0; k--) {
      var tr = traces[k];
      tr.a -= 0.012 * dt;
      if (tr.a <= 0) { traces.splice(k, 1); continue; }
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, tr.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(150,155,165,' + (tr.a * 0.22) + ')';
      ctx.fill();
    }

    requestAnimationFrame(boucle);
  }

  if (reduce) {
    // Mouvement réduit : une vitre parsemée de gouttes, figée.
    gouttes.forEach(function (g) { g.r = 0.7 + Math.random() * 3; dessiner(g); });
  } else {
    requestAnimationFrame(boucle);
  }
})();
</script>
</body>
</html>
