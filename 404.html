<style>

  * { margin:0; padding:0; box-sizing:border-box; }

<main class="contenu">

  <a class="retour" href="/accueil/" title="Retour a l'accueil" aria-label="Retour a l'accueil">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/>
    </svg>
  </a>
</main>

<script>
/* Fin d'averse : quelques gouttes qui s'etirent et degoulinent lentement sur la
   vitre, comme s'il restait de la pluie apres l'ondee. Canvas 2D, sans dependance. */
(function () {
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cv = document.getElementById('pluie');
  var ctx = cv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var L, H;
  function dim() {
    L = innerWidth; H = innerHeight;
    cv.width = L * dpr; cv.height = H * dpr;
    cv.style.width = L + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  dim(); addEventListener('resize', dim);

  var gouttes = [], traces = [];
  function residuelle() {
    return { x: Math.random()*L, y: Math.random()*H, r: 0.8+Math.random()*2.4, vy:0, len:0, coule:false };
  }
  function coulure(y) {
    return { x: Math.random()*L, y: (y==null? Math.random()*H : y),
             r: 3.5+Math.random()*3, vy: 0.1+Math.random()*0.2, len:0, coule:true };
  }
  var STATIQUES = Math.round(L*H/3800), COULURES = Math.max(5, Math.round(L/150));
  for (var i=0;i<STATIQUES;i++) gouttes.push(residuelle());
  for (var c=0;c<COULURES;c++) gouttes.push(coulure());

  function tete(x,y,r) {
    ctx.beginPath(); ctx.arc(x+r*0.12, y+r*0.4, r*0.95, 0, 6.2832);
    ctx.fillStyle='rgba(8,8,10,0.22)'; ctx.fill();
    var g=ctx.createRadialGradient(x-r*0.32,y-r*0.36,r*0.05,x,y,r);
    g.addColorStop(0,'rgba(255,255,255,0.80)'); g.addColorStop(0.35,'rgba(226,231,238,0.34)');
    g.addColorStop(0.72,'rgba(150,158,170,0.18)'); g.addColorStop(0.93,'rgba(64,68,78,0.34)');
    g.addColorStop(1,'rgba(26,28,36,0.60)');
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fillStyle=g; ctx.fill();
    if (r>1.2){ ctx.beginPath(); ctx.arc(x-r*0.36,y-r*0.38,r*0.24,0,6.2832);
      ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.fill(); }
  }
  function dessiner(g) {
    if (g.coule && g.len>1) {
      var lg=ctx.createLinearGradient(g.x,g.y-g.len,g.x,g.y);
      lg.addColorStop(0,'rgba(210,216,224,0)'); lg.addColorStop(1,'rgba(220,225,233,0.28)');
      ctx.strokeStyle=lg; ctx.lineCap='round'; ctx.lineWidth=g.r*0.9;
      ctx.beginPath(); ctx.moveTo(g.x,g.y-g.len); ctx.lineTo(g.x,g.y); ctx.stroke();
    }
    tete(g.x,g.y,g.r);
  }
  var dernier=0;
  function boucle(t) {
    var dt=Math.min((t-dernier)||16,40)/16; dernier=t;
    ctx.clearRect(0,0,L,H);
    for (var i=0;i<gouttes.length;i++) {
      var g=gouttes[i];
      if (g.coule) {
        // Pluie franche mais mesuree : des coulures visibles, sans le deluge.
        g.vy += 0.012*dt; if (g.vy>3.2) g.vy=3.2;
        g.y += g.vy*dt; g.x += Math.sin(g.y*0.05)*0.2;
        g.len += (Math.min(g.vy*20,78)-g.len)*0.1*dt;
        if (Math.random()<0.09*dt) traces.push({ x:g.x+(Math.random()-0.5)*g.r, y:g.y-g.r,
                                                  r:g.r*(0.24+Math.random()*0.2), a:1 });
        for (var j=0;j<gouttes.length;j++) {
          var s=gouttes[j]; if (s===g||s.coule) continue;
          var dx=s.x-g.x, dy=s.y-g.y;
          if (dx*dx+dy*dy < (g.r+s.r)*(g.r+s.r)) { g.r=Math.min(8,Math.sqrt(g.r*g.r+s.r*s.r)); Object.assign(s,residuelle()); }
        }
        if (g.y-g.len > H+20) Object.assign(g,coulure(-20));
      } else {
        g.r += 0.003*dt*(0.4+Math.random());
        if (g.r>2.8 && Math.random()<0.02*dt) { g.coule=true; g.vy=0.4+Math.random()*0.6; }
      }
      dessiner(g);
    }
    for (var k=traces.length-1;k>=0;k--) {
      var tr=traces[k]; tr.a -= 0.006*dt;
      if (tr.a<=0){ traces.splice(k,1); continue; }
      ctx.beginPath(); ctx.arc(tr.x,tr.y,tr.r,0,6.2832);
      ctx.fillStyle='rgba(206,212,220,'+(tr.a*0.26)+')'; ctx.fill();
    }
    requestAnimationFrame(boucle);
  }
  if (reduce) gouttes.forEach(function(g){ g.coule=false; g.len=0; dessiner(g); });
  else requestAnimationFrame(boucle);
})();
</script>
